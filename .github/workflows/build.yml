name: Build and Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Superheroes.sln

      - name: Build
        run: dotnet build Superheroes.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Superheroes.sln --no-build --configuration Release
